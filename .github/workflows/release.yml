name: "Release"

on:
  push:
    branches:
      - beta
      - main

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true # ensure only one release workflow runs per branch (e.g., "release-beta" or "release-main")

permissions:
  contents: write # to be able to publish a github release
  issues: write # to be able to comment on released issues
  packages: write  # to be able to publish packages
  pull-requests: write # to be able to comment on released pull requests

jobs:
  release_utilities:
    name: "Release - @aetherisnova/utilities"
    uses: ./.github/workflows/release_call.yml
    with:
      package_dir: "utilities"
      package_name: "@aetherisnova/utilities"
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  # **MUST** come before "utilities" as it uses it as a dependency
  release_ui_components:
    needs: [release_utilities]
    name: "Release - @aetherisnova/ui-kit"
    uses: ./.github/workflows/release_call.yml
    with:
      package_dir: "ui-kit"
      package_name: "@aetherisnova/ui-kit"
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
