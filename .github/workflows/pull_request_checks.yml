name: "Pull Request: Checks"

on:
  pull_request:

jobs:
  changed_files:
    name: "Changed Files"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      ui_kit: ${{ steps.filter.outputs.ui_kit }}
      utilities: ${{ steps.filter.outputs.utilities }}
    steps:
      - name: "📥 Filter"
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ui_kit:
              - 'packages/ui-kit/**'
            utilities:
              - 'packages/utilities/**'

  ##
  # package specific
  ##

  pull_request_checks_ui_kit:
    name: "Pull Request Checks - @aetherisnova/ui-kit"
    needs: [changed_files]
    if: ${{ needs.changed_files.outputs.ui_kit == 'true' }}
    uses: ./.github/workflows/pull_request_checks_call.yml
    with:
      package_name: "@aetherisnova/utilities"

  pull_request_checks_utilities:
    name: "Pull Request Checks - @aetherisnova/utilities"
    needs: [changed_files]
    if: ${{ needs.changed_files.outputs.utilities == 'true' }}
    uses: ./.github/workflows/pull_request_checks_call.yml
    with:
      package_name: "@aetherisnova/utilities"
